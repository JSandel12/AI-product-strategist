# Реестр решений после запуска (Architecture & Product Decision Ledger)
decisions:
  - id: ADR-001
    title: "Краткое название решения"
    status: "proposed" # proposed | accepted | needs_revision | superseded
    owner: "Руководитель направления"
    decided_at: "YYYY-MM-DD"
    rationale_sources: ["SRC-01"]
    assumptions:
      - id: ASM-001
