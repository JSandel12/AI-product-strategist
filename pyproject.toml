[project]
name = "mgimo-product-strategist"
version = "1.0.0"
description = "IDE-native AI Product & Communications Strategist Agent Repository (MGIMO AI Challenge - Megafon Product Factory)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pypdf>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
