decisions:
  - id: ADR-001
    title: "Первый приоритет: проактивное предупреждение и 1-клик довыдача интернета из свободного остатка для семейных групп"
    status: "accepted_for_q1_validation"
    owner: "Руководитель направления"
    decided_at: "2026-11-20"
    rationale_sources: ["SRC-01", "SRC-02"]
    assumptions:
      - id: ASM-001
        statement: "Частота перебоев из-за исчерпания доли в семейном пакете >= 400 уникальных случаев в неделю по базе совместимых тарифов"
        threshold_to_flip: "Если < 250 случаев/нед., А/Б-тест по отключениям не уложится в Q2 (17.4 нед. при 200/нед.) — переключить Q2 на тест понятности операции или объединить с напоминанием о платеже."
      - id: ASM-002
        statement: "Задержка обновления остатков в биллинге <= 15 минут"
        threshold_to_flip: "Если задержка > 60 минут, запретить в коммуникациях обещание 'мгновенного предотвращения' и поднять порог срабатывания предупреждения."
    kpis:
      - metric: "Доля подходящих номеров, получивших ограничение интернета за 7 дней после низкого остатка"
        target: "Снижение с 12% до <= 9% (-3 п.п. / -25% отн.)"
        observation_window: "7 дней от первого подходящего события"
      - metric: "Доля ложных предупреждений и повторных списаний"
        target: "Ложные < 3%; повторные списания = 0%"
        observation_window: "Непрерывно в течение пилота"
    revision_triggers:
      - "Задержка синхронизации остатка в биллинге превышает 1 час"
      - "Поток подходящих случаев < 300 семейных групп в неделю"
      - "После отзыва согласия участником организатор продолжает видеть сведения (немедленная остановка пилота)"

  - id: ADR-002
    title: "Вторая волна (Q3–Q4): единый статус списаний и счёта для владельцев собственных устройств (роутер/планшет)"
    status: "deferred_to_q3_gate"
    owner: "Руководитель направления + Владелец системы расчётов"
    decided_at: "2026-11-20"
    rationale_sources: ["SRC-01"]
    assumptions:
      - id: ASM-003
        statement: "Разработка в Q2 ограничена 3 человеко-месяцами, поэтому единый новый кабинет на обе аудитории не помещается в пилот"
        threshold_to_flip: "Если выделят дополнительно >= 2 чел.-мес. разработчиков в Q2 или частота перебоев по семейным группам < 150/нед."
    kpis:
      - metric: "Подключённые владельцы нескольких номеров"
        target: "Рост с 800 до 1 400 (база) / 2 000 (при выделении доп. ресурса в Q3)"
        observation_window: "Q3–Q4 планового года"
    revision_triggers:
      - "Обращения владельцев роутеров по неуспешным списаниям превышают кейсы нехватки семейного трафика"
